[package]
name = "graph-memory"
version = "0.2.0"
description = "Graph Memory — 图式记忆系统"
authors = ["Graph Memory Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.75"
default-run = "graph-memory"

[lib]
name = "graph_memory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
petgraph = "0.8"
fastembed = "6"
ndarray = "0.16"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
